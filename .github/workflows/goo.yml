name: GOO-JOBB LIVE ENGINE
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  live:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Sync real jobs
        run: node scripts/sync-enterprise.mjs
      - name: Validate
        run: node -e "let x=require('./public/jobs.json');if(!Array.isArray(x)||!x.length)throw Error('NO_REAL_JOBS');console.log('REAL JOBS:',x.length)"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - name: Deploy
        id: d
        uses: actions/deploy-pages@v4
