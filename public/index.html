<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#050505">
<meta name="robots" content="index,follow">
<meta name="description" content="GOO-JOBB — worldwide real job search from public job sources. Search remote, onsite and hybrid jobs across categories and companies.">
<link rel="canonical" href="https://tv-u.github.io/Goo-jobb/">
<title>GOO-JOBB — Worldwide Real Jobs</title>

<style>
:root{
 --bg:#050505;
 --panel:#0d0d0d;
 --panel2:#121212;
 --text:#f7f7f7;
 --muted:#8e8e8e;
 --pink:#ff0080;
 --green:#00ff88;
 --yellow:#ffdd00;
 --border:#242424;
 --shadow:0 20px 70px rgba(0,0,0,.45);
}

*{box-sizing:border-box}

body{
 margin:0;
 background:
 radial-gradient(circle at 15% 0%,rgba(255,0,128,.10),transparent 30%),
 radial-gradient(circle at 85% 0%,rgba(0,255,136,.07),transparent 30%),
 var(--bg);
 color:var(--text);
 font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

a{color:inherit;text-decoration:none}

.container{
 width:min(1500px,94%);
 margin:auto;
}

.header{
 position:sticky;
 top:0;
 z-index:50;
 background:rgba(5,5,5,.88);
 backdrop-filter:blur(18px);
 border-bottom:1px solid var(--border);
}

.nav{
 min-height:72px;
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:20px;
}

.logo{
 font-size:28px;
 font-weight:900;
 letter-spacing:-1px;
}

.logo b{color:var(--pink)}
.logo span{color:var(--green)}

.live{
 color:var(--green);
 font-size:12px;
 font-weight:800;
 letter-spacing:1px;
}

.hero{
 padding:65px 0 35px;
}

.badge{
 display:inline-flex;
 padding:8px 13px;
 border:1px solid rgba(0,255,136,.25);
 border-radius:999px;
 color:var(--green);
 background:rgba(0,255,136,.05);
 font-size:12px;
 font-weight:800;
}

h1{
 max-width:900px;
 margin:18px 0 10px;
 font-size:clamp(42px,7vw,82px);
 line-height:.95;
 letter-spacing:-4px;
}

h1 em{
 color:var(--pink);
 font-style:normal;
}

.hero p{
 max-width:800px;
 color:var(--muted);
 font-size:18px;
 line-height:1.7;
}

.search{
 display:grid;
 grid-template-columns:2fr 1.2fr auto;
 gap:10px;
 margin-top:28px;
}

input,select,button{
 min-height:52px;
 border-radius:12px;
 border:1px solid var(--border);
 background:var(--panel);
 color:var(--text);
 padding:0 16px;
 font:inherit;
}

input:focus,select:focus{
 outline:2px solid rgba(255,0,128,.35);
 border-color:var(--pink);
}

button{
 cursor:pointer;
 font-weight:800;
}

.primary{
 background:linear-gradient(135deg,var(--pink),#ff4ba9);
 border:0;
}

.stats{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:12px;
 margin:20px 0 25px;
}

.stat{
 padding:22px;
 background:linear-gradient(145deg,#111,#090909);
 border:1px solid var(--border);
 border-radius:18px;
 box-shadow:var(--shadow);
}

.stat strong{
 display:block;
 font-size:30px;
 color:var(--green);
}

.stat span{
 color:var(--muted);
 font-size:11px;
 font-weight:800;
 letter-spacing:1px;
}

.layout{
 display:grid;
 grid-template-columns:280px 1fr;
 gap:18px;
 align-items:start;
}

.sidebar{
 position:sticky;
 top:90px;
 background:rgba(13,13,13,.9);
 border:1px solid var(--border);
 border-radius:18px;
 padding:18px;
}

.sidebar h3{
 margin-top:0;
}

.filter{
 margin:12px 0;
}

.filter label{
 display:block;
 color:var(--muted);
 font-size:12px;
 margin-bottom:7px;
}

.filter input,
.filter select{
 width:100%;
 min-height:44px;
}

.resultsbar{
 display:flex;
 justify-content:space-between;
 align-items:center;
 gap:10px;
 margin-bottom:12px;
}

.resultsbar strong{
 color:var(--yellow);
}

.jobs{
 display:grid;
 gap:12px;
}

.job{
 background:linear-gradient(145deg,#111,#090909);
 border:1px solid var(--border);
 border-radius:18px;
 padding:22px;
 transition:.2s;
}

.job:hover{
 transform:translateY(-2px);
 border-color:rgba(255,0,128,.35);
}

.jobtop{
 display:flex;
 justify-content:space-between;
 gap:15px;
}

.job h2{
 margin:0 0 8px;
 font-size:20px;
}

.company{
 color:var(--pink);
 font-weight:800;
}

.meta{
 display:flex;
 flex-wrap:wrap;
 gap:7px;
 margin:12px 0;
}

.tag{
 padding:6px 9px;
 border-radius:999px;
 border:1px solid #292929;
 background:#151515;
 color:#bbb;
 font-size:11px;
}

.remote{
 color:var(--green);
 border-color:rgba(0,255,136,.25);
}

.jobdesc{
 color:#aaa;
 line-height:1.6;
 max-height:72px;
 overflow:hidden;
}

.actions{
 display:flex;
 flex-wrap:wrap;
 gap:8px;
 margin-top:15px;
}

.actions a,
.actions button{
 min-height:40px;
 padding:0 12px;
}

.apply{
 background:var(--green);
 color:#00160d;
 border:0;
}

.save{
 background:#151515;
}

.empty{
 text-align:center;
 padding:70px 20px;
 color:var(--muted);
 border:1px dashed #333;
 border-radius:18px;
}

@media(max-width:900px){
 .layout{grid-template-columns:1fr}
 .sidebar{position:static}
 .search{grid-template-columns:1fr}
 .stats{grid-template-columns:repeat(2,1fr)}
}

@media(max-width:550px){
 .stats{grid-template-columns:1fr 1fr}
 h1{letter-spacing:-2px}
 .jobtop{display:block}
}
</style>
</head>

<body>

<header class="header">
 <div class="container nav">
  <a class="logo" href="./"><b>GOO</b>-<span>JOBB</span></a>
  <div class="live">● REAL JOB DATA • WORLDWIDE</div>
 </div>
</header>

<main class="container">

<section class="hero">
 <span class="badge">● LIVE WORLDWIDE JOB ENGINE</span>

 <h1>Find your next <em>real job.</em></h1>

 <p>
 Search verified public job listings across companies, categories,
 countries, remote opportunities and employment types.
 </p>

 <div class="search">
  <input id="q" placeholder="Job title, company, skill...">
  <input id="location" placeholder="Country, city, remote...">
  <button class="primary" id="searchBtn">Search Jobs</button>
 </div>
</section>

<section class="stats">
 <div class="stat">
  <strong id="total">—</strong>
  <span>REAL LISTINGS</span>
 </div>

 <div class="stat">
  <strong id="companies">—</strong>
  <span>COMPANIES</span>
 </div>

 <div class="stat">
  <strong id="categories">—</strong>
  <span>CATEGORIES</span>
 </div>

 <div class="stat">
  <strong id="sources">—</strong>
  <span>SOURCES</span>
 </div>
</section>

<section class="layout">

<aside class="sidebar">

 <h3>Advanced Filters</h3>

 <div class="filter">
  <label>Category</label>
  <select id="category">
   <option value="">All categories</option>
  </select>
 </div>

 <div class="filter">
  <label>Employment</label>
  <select id="type">
   <option value="">All types</option>
  </select>
 </div>

 <div class="filter">
  <label>Experience</label>
  <select id="experience">
   <option value="">All experience</option>
  </select>
 </div>

 <div class="filter">
  <label>Source</label>
  <select id="source">
   <option value="">All sources</option>
  </select>
 </div>

 <div class="filter">
  <label>Mode</label>
  <select id="mode">
   <option value="">All</option>
   <option value="remote">Remote</option>
   <option value="onsite">On-site</option>
  </select>
 </div>

 <div class="filter">
  <label>Sort</label>
  <select id="sort">
   <option value="newest">Newest</option>
   <option value="company">Company</option>
   <option value="title">Title</option>
  </select>
 </div>

 <button id="reset" style="width:100%;margin-top:10px">
  Reset Filters
 </button>

</aside>

<section>

 <div class="resultsbar">
  <div>
   <strong id="count">0</strong> jobs found
  </div>

  <button id="clearSaved">
   Clear Saved
  </button>
 </div>

 <div id="jobs" class="jobs"></div>

</section>

</section>

</main>

<script>
let jobs=[];
let filtered=[];
let saved=new Set(
 JSON.parse(localStorage.getItem("goo-jobb-saved") || "[]")
);

const $=id=>document.getElementById(id);

function escapeHTML(v){
 return String(v ?? "")
  .replaceAll("&","&amp;")
  .replaceAll("<","&lt;")
  .replaceAll(">","&gt;")
  .replaceAll('"',"&quot;")
  .replaceAll("'","&#039;");
}

function fillSelect(id,values){
 const el=$(id);
 const first=el.options[0].textContent;
 el.innerHTML=`<option value="">${first}</option>`;

 values
  .filter(Boolean)
  .sort((a,b)=>a.localeCompare(b))
  .forEach(v=>{
   const o=document.createElement("option");
   o.value=v;
   o.textContent=v;
   el.appendChild(o);
  });
}

function getText(j){
 return [
  j.title,
  j.company,
  j.location,
  j.category,
  j.employmentType,
  j.experience,
  j.description,
  j.source
 ].join(" ").toLowerCase();
}

function render(){
 const q=$("q").value.trim().toLowerCase();
 const loc=$("location").value.trim().toLowerCase();
 const cat=$("category").value;
 const type=$("type").value;
 const exp=$("experience").value;
 const source=$("source").value;
 const mode=$("mode").value;
 const sort=$("sort").value;

 filtered=jobs.filter(j=>{
  const text=getText(j);

  if(q && !text.includes(q)) return false;

  if(loc &&
    !String(j.location||"").toLowerCase().includes(loc)
  ) return false;

  if(cat && j.category!==cat) return false;
  if(type && j.employmentType!==type) return false;
  if(exp && j.experience!==exp) return false;
  if(source && j.source!==source) return false;

  if(mode==="remote" && !j.remote) return false;
  if(mode==="onsite" && j.remote) return false;

  return true;
 });

 filtered.sort((a,b)=>{
  if(sort==="company")
   return String(a.company).localeCompare(String(b.company));

  if(sort==="title")
   return String(a.title).localeCompare(String(b.title));

  return (
   (Date.parse(b.postedAt||"")||0) -
   (Date.parse(a.postedAt||"")||0)
  );
 });

 $("count").textContent=
  filtered.length.toLocaleString();

 const fragment=document.createDocumentFragment();

 if(!filtered.length){
  $("jobs").innerHTML=
   '<div class="empty">No matching real jobs found.</div>';
  return;
 }

 filtered.slice(0,500).forEach(j=>{
  const article=document.createElement("article");
  article.className="job";

  const savedNow=saved.has(j.id);

  article.innerHTML=`
   <div class="jobtop">
    <div>
     <h2>${escapeHTML(j.title)}</h2>
     <div class="company">${escapeHTML(j.company)}</div>
    </div>
   </div>

   <div class="meta">
    <span class="tag">${escapeHTML(j.category)}</span>
    <span class="tag">${escapeHTML(j.location)}</span>
    ${
      j.remote
      ? '<span class="tag remote">REMOTE</span>'
      : '<span class="tag">ON-SITE / HYBRID</span>'
    }
    ${
      j.employmentType
      ? `<span class="tag">${escapeHTML(j.employmentType)}</span>`
      : ""
    }
    ${
      j.experience
      ? `<span class="tag">${escapeHTML(j.experience)}</span>`
      : ""
    }
    <span class="tag">${escapeHTML(j.source)}</span>
   </div>

   ${
    j.salary
    ? `<div class="tag">${escapeHTML(j.salary)}</div>`
    : ""
   }

   <p class="jobdesc">
    ${escapeHTML(j.description || "Open the original listing for full details.")}
   </p>

   <div class="actions">
    <a
      class="apply"
      href="${escapeHTML(j.applyUrl || j.url)}"
      target="_blank"
      rel="nofollow noopener noreferrer"
    >Apply</a>

    <a
      href="${escapeHTML(j.url)}"
      target="_blank"
      rel="noopener noreferrer"
    >Original Listing</a>

    <button class="save" data-save="${escapeHTML(j.id)}">
      ${savedNow ? "★ Saved" : "☆ Save"}
    </button>

    <button
      data-share="${escapeHTML(j.id)}"
    >Share</button>
   </div>
  `;

  fragment.appendChild(article);
 });

 $("jobs").replaceChildren(fragment);

 document.querySelectorAll("[data-save]").forEach(btn=>{
  btn.onclick=()=>{
   const id=btn.dataset.save;

   if(saved.has(id)) saved.delete(id);
   else saved.add(id);

   localStorage.setItem(
    "goo-jobb-saved",
    JSON.stringify([...saved])
   );

   render();
  };
 });

 document.querySelectorAll("[data-share]").forEach(btn=>{
  btn.onclick=async()=>{
   const j=jobs.find(x=>x.id===btn.dataset.share);
   if(!j) return;

   const data={
    title:j.title,
    text:`${j.title} — ${j.company}`,
    url:j.applyUrl||j.url
   };

   try{
    if(navigator.share)
      await navigator.share(data);
    else{
      await navigator.clipboard.writeText(data.url);
      btn.textContent="Copied";
      setTimeout(()=>btn.textContent="Share",1200);
    }
   }catch{}
  };
 });
}

async function boot(){
 try{
  const r=await fetch("./jobs-worldwide.json",{
   cache:"no-store"
  });

  if(!r.ok)
   throw new Error("job dataset unavailable");

  jobs=await r.json();

  if(!Array.isArray(jobs))
   throw new Error("invalid dataset");

  $("total").textContent=
   jobs.length.toLocaleString();

  $("companies").textContent=
   new Set(jobs.map(x=>x.company).filter(Boolean)).size.toLocaleString();

  $("categories").textContent=
   new Set(jobs.map(x=>x.category).filter(Boolean)).size.toLocaleString();

  $("sources").textContent=
   new Set(jobs.map(x=>x.source).filter(Boolean)).size.toLocaleString();

  fillSelect(
   "category",
   [...new Set(jobs.map(x=>x.category))]
  );

  fillSelect(
   "type",
   [...new Set(jobs.map(x=>x.employmentType))]
  );

  fillSelect(
   "experience",
   [...new Set(jobs.map(x=>x.experience))]
  );

  fillSelect(
   "source",
   [...new Set(jobs.map(x=>x.source))]
  );

  render();

 }catch(e){
  $("jobs").innerHTML=
   `<div class="empty">
    Real job dataset could not be loaded.<br>
    Sync the repository and refresh.
   </div>`;
 }
}

[
 "q",
 "location",
 "category",
 "type",
 "experience",
 "source",
 "mode",
 "sort"
].forEach(id=>{
 $(id).addEventListener(
  "input",
  render
 );

 $(id).addEventListener(
  "change",
  render
 );
});

$("searchBtn").onclick=render;

$("reset").onclick=()=>{
 $("q").value="";
 $("location").value="";
 $("category").value="";
 $("type").value="";
 $("experience").value="";
 $("source").value="";
 $("mode").value="";
 $("sort").value="newest";
 render();
};

$("clearSaved").onclick=()=>{
 saved.clear();
 localStorage.removeItem("goo-jobb-saved");
 render();
};

boot();
</script>

</body>
</html>
