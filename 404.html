<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GOO-JOBB</title>
<meta name="robots" content="noindex,follow">
<meta name="description" content="GOO-JOBB page routing fallback.">
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
background:#0a0a0a;
color:#fff;
font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
display:grid;
place-items:center;
padding:24px
}
main{
width:min(680px,100%);
padding:36px;
border-radius:26px;
border:1px solid #292929;
background:#161616;
text-align:center
}
h1{margin:0 0 12px;font-size:48px}
p{color:#aaa;line-height:1.6}
a{
display:inline-block;
margin-top:20px;
padding:13px 22px;
border-radius:999px;
background:#ff0080;
color:#fff;
text-decoration:none;
font-weight:700
}
</style>
</head>
<body>
<main>
<h1>GOO-JOBB</h1>
<p>Opening the GOO-JOBB application…</p>
<a href="/Goo-jobb/">Return to GOO-JOBB</a>
</main>

<script>
(function(){
    var base="/Goo-jobb";
    var path=location.pathname||"";
    var query=location.search||"";
    var hash=location.hash||"";

    if(path.indexOf(base)===0){
        var target=base+"/"+query+hash;
        setTimeout(function(){
            location.replace(target);
        },100);
    }
})();
</script>
</body>
