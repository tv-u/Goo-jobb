name: GOO-JOBB Worldwide Live Sync
on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"
  push:
    branches: [main]
    paths-ignore:
      - 'jobs-worldwide.json'
      - 'data/**'
      - 'scripts/**'
concurrency:
  group: goo-jobb-main-data-writes
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Source health
        run: python scripts/source_health.py
      - name: Existing live job ingestion
        run: python scripts/live_sync.py
      - name: Deduplicate and validate real jobs
        run: python scripts/live_gate.py
      - name: Commit live data
        run: |
          git config user.name "GOO-JOBB Bot"
          git config user.email "goo-jobb-bot@users.noreply.github.com"
          git add jobs-worldwide.json data/ scripts/
          git diff --cached --quiet || git commit -m "chore: refresh worldwide live jobs"
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then break; fi
            if [ \"$attempt\" -eq 4 ]; then exit 1; fi
            sleep 5
          done