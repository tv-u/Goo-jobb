<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GOO-JOBB — Real Jobs Worldwide</title>
<meta name="description" content="Search real jobs worldwide across public company career feeds, ATS boards and job APIs.">
<link rel="canonical" href="/">
<meta name="theme-color" content="#ff0080">
<link rel="manifest" href="/manifest.webmanifest">
<style>
:root{--bg:#050507;--panel:#0d0d12;--line:#22222b;--pink:#ff0080;--green:#00ff88;--yellow:#ffdd00;--text:#f5f7fb;--muted:#9aa0ad}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#24102b,transparent 42%),var(--bg);color:var(--text);font:15px system-ui,-apple-system,Segoe UI,sans-serif}
a{color:inherit;text-decoration:none}.wrap{max-width:1180px;margin:auto;padding:20px}.nav{display:flex;align-items:center;justify-content:space-between;gap:15px}.brand{font-weight:900;font-size:25px;letter-spacing:-1px}.brand b{color:var(--pink)}.pill{border:1px solid var(--line);padding:9px 13px;border-radius:999px;background:#0b0b10}
.hero{padding:65px 0 30px;text-align:center}.hero h1{font-size:clamp(38px,7vw,76px);line-height:.95;margin:0 0 18px}.hero h1 span{color:var(--green)}.hero p{color:var(--muted);max-width:680px;margin:0 auto 25px;font-size:17px}
.search{display:grid;grid-template-columns:1fr 190px 130px;gap:10px;max-width:900px;margin:auto}.input,.select,.btn{min-height:52px;border:1px solid var(--line);border-radius:14px;background:#0c0c11;color:var(--text);padding:0 15px}.btn{cursor:pointer;background:linear-gradient(135deg,var(--pink),#7d22ff);font-weight:800}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:25px 0}.stat,.card{border:1px solid var(--line);background:linear-gradient(180deg,#101017,#0a0a0e);border-radius:18px;padding:17px}.stat strong{font-size:26px;color:var(--yellow)}.muted{color:var(--muted)}
.toolbar{display:flex;gap:10px;justify-content:space-between;align-items:center;margin:20px 0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.card h3{margin:0 0 7px}.company{color:var(--green)}.tag{display:inline-block;border:1px solid #30303b;border-radius:999px;padding:4px 8px;margin:4px 4px 0 0;color:#cfd3dc;font-size:12px}.apply{display:inline-block;margin-top:13px;color:var(--yellow);font-weight:800}
.bottom{position:sticky;bottom:0;background:#07070add;backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:12px;text-align:center;margin-top:35px}
@media(max-width:750px){.search,.grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.hero{padding-top:35px}}
</style>
</head>
<body>
<div class="wrap">
<nav class="nav"><a class="brand" href="/">GOO-<b>JOBB</b></a><div><a class="pill" href="/api/sitemap">Sitemap</a> <button class="pill" onclick="install()">Install</button></div></nav>
<section class="hero"><h1>Find <span>real jobs.</span><br>Worldwide.</h1><p>One search across public career feeds, ATS boards and open job APIs. No fake listings.</p>
<form id="search" class="search"><input id="q" class="input" placeholder="Job title, skill, company…"><input id="loc" class="input" placeholder="Country or city"><button class="btn">Search</button></form></section>
<section id="stats" class="stats"></section>
<div class="toolbar"><strong id="heading">Latest jobs</strong><select id="sort" class="select"><option value="new">Newest</option><option value="relevance">Relevance</option></select></div>
<main id="jobs" class="grid"></main>
<div class="bottom"><button class="btn" onclick="loadJobs(true)">Load more</button></div>
</div>
<script src="/ads.js"></script><script src="/register-sw.js"></script>
<script>
let cursor="",q="",loc="";
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
async function api(u){const r=await fetch(u);if(!r.ok)throw Error("Request failed");return r.json()}
async function stats(){try{const s=await api("/api/stats");document.getElementById("stats").innerHTML=[["Active jobs",s.jobs],["Companies",s.companies],["Countries",s.countries],["Sources",s.sources]].map(x=>`<div class="stat"><strong>${x[1]??0}</strong><div class="muted">${x[0]}</div></div>`).join("")}catch{}}
async function loadJobs(reset=false){if(reset){cursor="";document.getElementById("jobs").innerHTML=""}const p=new URLSearchParams({limit:"24"});if(q)p.set("q",q);if(loc)p.set("location",loc);if(cursor)p.set("cursor",cursor);p.set("sort",document.getElementById("sort").value);try{const d=await api("/api/jobs?"+p);cursor=d.next_cursor||"";document.getElementById("heading").textContent=`${d.total??0} matching jobs`;document.getElementById("jobs").insertAdjacentHTML("beforeend",d.jobs.map(j=>`<article class="card"><div class="muted">${esc(j.category)} · ${esc(j.remote_type)}</div><h3><a href="/jobs/${encodeURIComponent(j.slug)}">${esc(j.title)}</a></h3><div class="company">${esc(j.company)}</div><p class="muted">${esc(j.location||"Worldwide")} · ${esc(j.country||"")}</p><div>${(j.skills||[]).slice(0,7).map(x=>`<span class="tag">${esc(x)}</span>`).join("")}</div><a class="apply" href="${esc(j.apply_url)}" target="_blank" rel="nofollow noopener">Apply ↗</a></article>`).join(""))}catch(e){document.getElementById("jobs").innerHTML='<div class="card">Unable to load jobs right now. Please retry.</div>'}}
document.getElementById("search").onsubmit=e=>{e.preventDefault();q=document.getElementById("q").value.trim();loc=document.getElementById("loc").value.trim();loadJobs(true)};
document.getElementById("sort").onchange=()=>loadJobs(true);
let deferred;window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferred=e});window.install=()=>deferred?.prompt();
stats();loadJobs(true);
</script>
</body></html>
