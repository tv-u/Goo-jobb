name: GOO-JOBB Real Jobs + GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: "7 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: goo-jobb-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sync real jobs
        run: node scripts/sync-real-jobs.mjs

      - name: Validate dataset
        run: |
          test -s public/jobs.json
          test -s public/job-sync-status.json
          COUNT=$(node -e "const x=require('./public/jobs.json'); console.log(x.total || x.jobs.length)")
          echo "REAL JOB COUNT: $COUNT"
          if [ "$COUNT" -lt 1 ]; then
            echo "No real jobs found. Deployment stopped."
            exit 1
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
