<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Talent Profile | GOO-JOBB</title>
<meta name="description" content="Create a professional talent profile.">
<link rel="canonical" href="/Goo-jobb/career/">

<link rel="stylesheet" href="/Goo-jobb/career/goo-career.css">

</head>
<body>
<div class="career-shell">

<section class="career-hero">
<h1>Talent Profile</h1>
<p>
Create a professional profile from your real experience.
No fabricated candidate records are generated.
</p>
</section>

<form id="goo-profile-form" class="career-form">
<input data-profile="name" placeholder="Name">
<input data-profile="headline" placeholder="Headline">
<input data-profile="skills" placeholder="Skills">
<input data-profile="availability" placeholder="Availability">
<input data-profile="location" placeholder="Location">
<textarea data-profile="about" placeholder="About you"></textarea>
<button class="career-button">Save Talent Profile</button>
</form>

<p id="profile-status"></p>

</div>

<script src="/Goo-jobb/career/goo-career-hub.js" defer></script>

</body>
</html>
