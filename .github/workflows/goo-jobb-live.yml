name: GOO-JOBB Live Feature Deploy

on:
  push:
    branches:
      - main
    paths:
      - "live/**"
      - "index.html"
      - "public/**"
      - "manifest.webmanifest"
      - "robots.txt"
  workflow_dispatch:

concurrency:
  group: goo-jobb-live-pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Build Pages
        run: |
          rm -rf _site
          mkdir -p _site
          cp -R public/. _site/ 2>/dev/null || true
          cp index.html _site/index.html
          cp -R live _site/live
          cp robots.txt _site/robots.txt 2>/dev/null || true
          cp manifest.webmanifest _site/manifest.webmanifest 2>/dev/null || true
          touch _site/.nojekyll
          test -s _site/index.html
          test -s _site/live/live-ai.js
          test -s _site/live/live-runtime.js
          test -s _site/live/live-features.json
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
