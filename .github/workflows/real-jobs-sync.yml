name: GOO-JOBB Real Jobs Sync

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: "7 * * * *"

permissions:
  contents: write

concurrency:
  group: goo-jobb-real-job-sync
  cancel-in-progress: true

jobs:

  sync:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sync public real jobs
        run: node scripts/sync-real-jobs.mjs

      - name: Validate
        run: |
          test -f public/index.html
          test -f public/jobs.json

          node <<'NODE'
          const fs=require("fs");
          const d=JSON.parse(fs.readFileSync("public/jobs.json","utf8"));

          if(!Array.isArray(d.jobs))
            throw new Error("jobs array missing");

          for(const j of d.jobs){
            if(!j.title || !j.company || !j.url)
              throw new Error("Invalid job record");
          }

          console.log("REAL JOBS:",d.jobs.length);
          console.log("ACTIVE SOURCES:",d.active_source_count);
          NODE

      - name: Mirror static site to repository root
        run: |
          cp public/index.html ./index.html
          cp public/jobs.json ./jobs.json
          cp public/job-sync-status.json ./job-sync-status.json

          if [ -f public/icon.svg ]; then
            cp public/icon.svg ./icon.svg
          fi

          if [ -f public/manifest.webmanifest ]; then
            cp public/manifest.webmanifest ./manifest.webmanifest
          fi

          if [ -f public/robots.txt ]; then
            cp public/robots.txt ./robots.txt
          fi

          if [ -f public/sitemap.xml ]; then
            cp public/sitemap.xml ./sitemap.xml
          fi

          touch .nojekyll

      - name: Commit real dataset
        run: |
          git config user.name "GOO-JOBB Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            index.html \
            jobs.json \
            job-sync-status.json \
            icon.svg \
            manifest.webmanifest \
            robots.txt \
            sitemap.xml \
            .nojekyll \
            public/index.html \
            public/jobs.json \
            public/job-sync-status.json

          if git diff --cached --quiet; then
            echo "No changes to publish."
          else
            git commit -m "chore: refresh real jobs"
            git push
          fi
