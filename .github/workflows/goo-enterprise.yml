name: GOO-JOBB WORLD ENGINE
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: goo-jobb
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with: {node-version: 22}
      - run: node scripts/sync-enterprise.mjs
      - run: node -e "let j=require('./public/jobs.json');if(!j.length)process.exit(1);console.log('LIVE:',j.length)"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with: {path: public}
      - id: deployment
        uses: actions/deploy-pages@v4
        env:
          GITHUB_TOKEN: ${{github.token}}
