name: GOO-JOBB Worldwide Jobs Sync
on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python scripts/sync_jobs.py
      - name: Commit updated jobs
        run: |
          git config user.name "GOO-JOBB Bot"
          git config user.email "goo-jobb-bot@users.noreply.github.com"
          git add jobs-worldwide.json data/source-health.json
          git diff --cached --quiet || git commit -m "chore: refresh worldwide jobs"
          git push
