name: GOO-JOBB GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "23 */6 * * *"
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sync worldwide public jobs
        run: python scripts/sync_jobs.py
      - name: Validate site
        run: python scripts/validate_site.py
      - name: Commit generated data
        run: |
          git config user.name "GOO-JOBB Bot"
          git config user.email "goo-jobb-bot@users.noreply.github.com"
          git add data jobs-worldwide.json robots.txt sitemap.xml
          git diff --cached --quiet || git commit -m "chore: refresh worldwide jobs"
          git push
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
