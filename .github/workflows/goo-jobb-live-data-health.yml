name: GOO-JOBB Live Data Health

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

jobs:
  verify-live-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GOO-JOBB
        uses: actions/checkout@v4

      - name: Validate current worldwide jobs
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path("jobs-worldwide.json")
          if not p.is_file():
              raise SystemExit("Missing jobs-worldwide.json")

          data = json.loads(p.read_text(encoding="utf-8"))
          jobs = data.get("jobs")
          sources = data.get("sources")

          if not isinstance(jobs, list) or not jobs:
              raise SystemExit("No valid jobs in dataset")
          if not isinstance(sources, list) or not sources:
              raise SystemExit("Source registry missing")

          valid = 0
          for job in jobs:
              if not isinstance(job, dict):
                  continue
              if job.get("title") and str(job.get("url", "")).startswith(("https://", "http://")):
                  valid += 1

          if valid == 0:
              raise SystemExit("No valid job records")

          print("TOTAL JOBS:", len(jobs))
          print("VALID JOBS:", valid)
          print("SOURCES REGISTERED:", len(sources))
          print("GOO-JOBB LIVE DATA: HEALTHY")
          PY
