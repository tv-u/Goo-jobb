name: GOO-JOBB GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Validate & Prepare
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Verify site files
        run: |
          set -e
          echo "=== GOO-JOBB BUILD CHECK ==="

          test -f index.html || {
            echo "ERROR: root index.html missing"
            exit 1
          }

          test -s index.html || {
            echo "ERROR: index.html is empty"
            exit 1
          }

          echo "index.html: OK"
          echo "Repository files:"
          find . -type f \
            ! -path './.git/*' \
            ! -path './node_modules/*' | sort

          echo
          echo "HTML title:"
          grep -oi '<title[^>]*>[^<]*</title>' index.html | head -1 || true

          echo
          echo "File count:"
          find . -type f \
            ! -path './.git/*' \
            ! -path './node_modules/*' | wc -l

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Deployment successful
        run: |
          echo "======================================"
          echo "GOO-JOBB DEPLOYMENT SUCCESSFUL"
          echo "URL: ${{ steps.deployment.outputs.page_url }}"
          echo "======================================"
