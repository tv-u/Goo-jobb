name: GOO-JOBB Real Job Sync

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */3 * * *"
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: goo-jobb-job-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Fetch real public jobs
        run: node scripts/sync-static.mjs

      - name: Validate generated data
        run: |
          test -s data/jobs.json
          node -e "
          const x=require('./data/jobs.json');
          if(!Array.isArray(x.jobs)) process.exit(1);
          console.log('REAL JOBS:',x.total);
          console.log('SOURCES:',x.sources.length);
          "

      - name: Publish job data
        run: |
          cp data/jobs.json public/jobs.json
          cp data/health.json public/health.json

      - name: Commit updated jobs
        run: |
          git config user.name "GOO-JOBB Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/jobs.json public/health.json data/jobs.json data/health.json
          git diff --cached --quiet || git commit -m "chore: sync real jobs"
          git push
