<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Profile | GOO-JOBB</title>
<meta name="description" content="Build and save your professional profile.">
<link rel="canonical" href="/Goo-jobb/career/">

<link rel="stylesheet" href="/Goo-jobb/career/goo-career.css">

</head>
<body>
<div class="career-shell">

<section class="career-hero">
<h1>My Profile</h1>
<p>Your profile is stored locally in your browser.</p>
</section>

<form id="goo-profile-form" class="career-form">
<input data-profile="name" placeholder="Full name">
<input data-profile="headline" placeholder="Professional headline">
<input data-profile="location" placeholder="Location">
<input data-profile="skills" placeholder="Skills">
<input data-profile="experience" placeholder="Experience">
<input data-profile="portfolio" placeholder="Portfolio URL">
<textarea data-profile="about" placeholder="Professional summary"></textarea>
<button class="career-button">Save Profile</button>
</form>

<p id="profile-status"></p>

</div>

<script src="/Goo-jobb/career/goo-career-hub.js" defer></script>

</body>
</html>
