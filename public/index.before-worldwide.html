<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GOO-JOBB — World-Class Real Job Search</title>
<meta name="description" content="Search 50,000+ real jobs from verified public sources. Advanced filters, AI tools, and fast search.">
<link rel="canonical" href="/">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#6366f1">
<style>
:root { --bg: #0a0a12; --panel: #141420; --border: #2a2a3a; --text: #f0f0f5; --muted: #9a9ab0; --primary: #6366f1; --accent: #a855f7; --green: #10b981; --yellow: #f59e0b; }
* { box-sizing: border-box; margin:0; padding:0; }
body { background: radial-gradient(circle at 20% 20%, #1a1a2e, var(--bg)); color: var(--text); font-family: system-ui, -apple-system, sans-serif; line-height: 1.6; }
.wrap { max-width: 1200px; margin: auto; padding: 20px; }
header { display:flex; justify-content:space-between; align-items:center; padding:20px 0; border-bottom:1px solid var(--border); }
.logo { font-size:1.8rem; font-weight:900; background: linear-gradient(135deg, var(--primary), var(--accent)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
.nav-links { display:flex; gap:20px; }
.nav-links a { color: var(--muted); text-decoration:none; font-weight:600; }
.nav-links a:hover { color: var(--text); }
.hero { text-align:center; padding:60px 0 40px; }
.hero h1 { font-size:3rem; margin-bottom:10px; }
.hero p { color: var(--muted); max-width:600px; margin:0 auto 30px; }
.search-box { display:flex; gap:10px; max-width:800px; margin:auto; background:var(--panel); padding:15px; border-radius:15px; border:1px solid var(--border); }
.search-box input, .search-box select, .search-box button { padding:12px; border-radius:10px; border:1px solid var(--border); background:#1e1e2e; color:var(--text); }
.search-box input { flex:1; }
.search-box button { background: linear-gradient(135deg, var(--primary), var(--accent)); color:white; font-weight:bold; cursor:pointer; border:none; }
.stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:15px; margin:30px 0; }
.stat-card { background:var(--panel); border:1px solid var(--border); padding:20px; border-radius:15px; text-align:center; }
.stat-card .num { font-size:2rem; font-weight:800; color: var(--green); }
.stat-card .label { color:var(--muted); }
.filters { display:flex; gap:10px; flex-wrap:wrap; margin:20px 0; }
.filter-pill { background:var(--panel); border:1px solid var(--border); padding:8px 16px; border-radius:20px; cursor:pointer; color:var(--muted); }
.filter-pill.active { background: var(--primary); color:white; border-color:var(--primary); }
.jobs-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:15px; }
.job-card { background:var(--panel); border:1px solid var(--border); border-radius:15px; padding:20px; transition: transform .2s; }
.job-card:hover { transform: translateY(-3px); border-color:var(--primary); }
.job-card h3 { font-size:1.2rem; margin-bottom:5px; }
.job-card .company { color:var(--green); font-weight:600; }
.job-card .meta { color:var(--muted); font-size:0.9rem; margin:8px 0; }
.job-card .skills { margin-top:10px; }
.job-card .skill-tag { display:inline-block; background:#2a2a3a; padding:4px 8px; border-radius:10px; font-size:0.8rem; margin-right:5px; }
.job-card .apply-btn { display:inline-block; margin-top:15px; background:var(--primary); color:white; padding:10px 20px; border-radius:8px; text-decoration:none; font-weight:bold; }
.job-card .apply-btn:hover { background:var(--accent); }
footer { margin-top:50px; padding:30px 0; text-align:center; color:var(--muted); border-top:1px solid var(--border); }
@media(max-width:700px) { .search-box { flex-direction:column; } .hero h1 { font-size:2.2rem; } }
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="logo">GOO-JOBB</div>
  <nav class="nav-links">
    <a href="/">Home</a>
    <a href="/remote-jobs">Remote</a>
    <a href="/categories">Categories</a>
    <a href="/ai-tools">AI Tools</a>
  </nav>
</header>
<section class="hero">
  <h1>World-Class Real Job Search</h1>
  <p>Find your next opportunity from 50,000+ verified jobs across the globe.</p>
  <form id="searchForm" class="search-box">
    <input type="text" id="q" placeholder="Job title, skill, company...">
    <input type="text" id="loc" placeholder="Location or Remote">
    <button type="submit">Search</button>
  </form>
</section>
<section class="stats" id="stats"></section>
<div class="filters" id="categoryFilters"></div>
<main id="jobsContainer" class="jobs-grid"></main>
<footer>GOO-JOBB © 2026 · Real Jobs · Worldwide</footer>
</div>
<script src="/ads.js"></script>
<script src="/register-sw.js"></script>
<script>
const API = '/api';
let currentPage = 1;
let currentQuery = '';
let currentLocation = '';
let currentCategory = '';
function escapeHtml(s) { const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
function formatNumber(n) { if (n >= 1000000) return (n/1000000).toFixed(1)+'M'; if (n >= 1000) return (n/1000).toFixed(0)+'K'; return n.toString(); }
async function loadStats() {
  try { const r = await fetch(API+'/stats'); const s = await r.json();
    document.getElementById('stats').innerHTML = `
      <div class="stat-card"><div class="num">${formatNumber(s.jobs)}</div><div class="label">Active Jobs</div></div>
      <div class="stat-card"><div class="num">${formatNumber(s.companies)}</div><div class="label">Companies</div></div>
      <div class="stat-card"><div class="num">${formatNumber(s.countries)}</div><div class="label">Countries</div></div>
      <div class="stat-card"><div class="num">${s.sources}</div><div class="label">Sources</div></div>`;
  } catch(e) {}
}
async function loadCategories() {
  try { const r = await fetch(API+'/categories'); const d = await r.json();
    const container = document.getElementById('categoryFilters');
    container.innerHTML = '<span class="filter-pill active" data-cat="">All</span>';
    d.categories.forEach(c => {
      container.innerHTML += `<span class="filter-pill" data-cat="${c.category}">${c.category} (${c.jobs})</span>`;
    });
    container.querySelectorAll('.filter-pill').forEach(pill => {
      pill.onclick = () => {
        container.querySelectorAll('.filter-pill').forEach(p => p.classList.remove('active'));
        pill.classList.add('active');
        currentCategory = pill.dataset.cat;
        currentPage = 1;
        loadJobs(true);
      };
    });
  } catch(e) {}
}
async function loadJobs(reset = false) {
  if (reset) { currentPage = 1; document.getElementById('jobsContainer').innerHTML = ''; }
  const params = new URLSearchParams({ limit: '24', page: currentPage, q: currentQuery, location: currentLocation, category: currentCategory });
  try {
    const r = await fetch(API+'/jobs?'+params); const d = await r.json();
    document.getElementById('jobsContainer').insertAdjacentHTML('beforeend', d.jobs.map(j => `
      <article class="job-card">
        <h3>${escapeHtml(j.title)}</h3>
        <div class="company">${escapeHtml(j.company)}</div>
        <div class="meta">📍 ${escapeHtml(j.location)} · ${escapeHtml(j.remote_type)} · ${escapeHtml(j.category)}</div>
        <div class="skills">${(j.skills||[]).slice(0,5).map(s => `<span class="skill-tag">${escapeHtml(s)}</span>`).join('')}</div>
        <a href="${escapeHtml(j.apply_url)}" target="_blank" class="apply-btn">Apply ↗</a>
      </article>`).join(''));
    if (d.next_cursor) {
      currentPage++;
      const observer = new IntersectionObserver((entries) => { if (entries[0].isIntersecting) { observer.disconnect(); loadJobs(); } });
      observer.observe(document.querySelector('.job-card:last-child'));
    }
  } catch(e) {}
}
document.getElementById('searchForm').onsubmit = (e) => { e.preventDefault(); currentQuery = document.getElementById('q').value; currentLocation = document.getElementById('loc').value; loadJobs(true); };
loadStats(); loadCategories(); loadJobs(true);
</script>
</body>
</html>
