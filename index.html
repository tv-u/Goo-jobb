<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GOO-JOBB — Real Jobs Worldwide</title>
  <meta name="description" content="Find real jobs from 100+ public sources. Search by title, company, location, and category.">
  <meta name="keywords" content="remote jobs, work from home, software engineer, data scientist, sales, marketing, customer support">
  <link rel="canonical" href="https://tv-u.github.io/Goo-jobb/">
  <meta property="og:type" content="website">
  <meta property="og:title" content="GOO-JOBB — Real Jobs Worldwide">
  <meta property="og:description" content="10,000+ real jobs from public feeds. No API keys required.">
  <meta property="og:url" content="https://tv-u.github.io/Goo-jobb/">
  <meta name="theme-color" content="#6366f1">
  <style>
    :root { --bg:#0a0a12; --panel:#141420; --border:#2a2a3a; --text:#f0f0f5; --muted:#9a9ab0; --primary:#6366f1; --green:#10b981; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { background:radial-gradient(circle at 20% 20%, #1a1a2e, var(--bg)); color:var(--text); font-family:system-ui, sans-serif; }
    .container { max-width:1200px; margin:auto; padding:20px; }
    header { text-align:center; padding:40px 0; }
    header h1 { font-size:2.8rem; font-weight:900; background:linear-gradient(135deg,var(--primary),#a855f7); -webkit-background-clip:text; -webkit-text-fill-color:transparent; margin-bottom:10px; }
    header p { color:var(--muted); font-size:1.2rem; }
    .search-bar { display:flex; gap:10px; max-width:800px; margin:20px auto; flex-wrap:wrap; }
    .search-bar input, .search-bar select { flex:1; min-width:200px; padding:12px; border-radius:10px; border:1px solid var(--border); background:#1e1e2e; color:var(--text); }
    .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:15px; margin:30px 0; }
    .stat-card { background:var(--panel); border:1px solid var(--border); padding:20px; border-radius:12px; text-align:center; }
    .stat-card .num { font-size:2rem; font-weight:800; color:var(--green); }
    .stat-card .label { color:var(--muted); }
    .jobs-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:15px; }
    .job-card { background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:18px; transition:transform .2s; }
    .job-card:hover { transform:translateY(-3px); border-color:var(--primary); }
    .job-card h3 { font-size:1.2rem; margin-bottom:5px; }
    .job-card .company { color:var(--green); font-weight:600; }
    .job-card .meta { color:var(--muted); font-size:0.9rem; margin:8px 0; }
    .job-card .apply-btn { display:inline-block; margin-top:15px; background:var(--primary); color:white; padding:10px 20px; border-radius:8px; text-decoration:none; font-weight:bold; }
    .job-card .apply-btn:hover { background:#4f46e5; }
    footer { margin-top:50px; padding:30px 0; text-align:center; color:var(--muted); border-top:1px solid var(--border); }
    #loadMore { display:block; width:200px; margin:30px auto; padding:12px; background:var(--primary); color:white; border:none; border-radius:8px; cursor:pointer; font-weight:bold; }
    #loadMore.hidden { display:none; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>GOO-JOBB</h1>
      <p>Real Jobs Worldwide — 100+ Public Sources</p>
    </header>

    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="Job title, company, or skill...">
      <select id="categoryFilter">
        <option value="">All Categories</option>
      </select>
    </div>

    <div class="stats" id="stats"></div>

    <main id="jobsContainer" class="jobs-grid"></main>

    <button id="loadMore" class="hidden">Load More Jobs</button>

    <footer>GOO-JOBB © 2026 · Real Jobs · Worldwide</footer>
  </div>

  <script>
    let allJobs = [];
    let filteredJobs = [];
    let displayedCount = 0;
    const BATCH_SIZE = 50;

    // Fetch jobs.json
    fetch('jobs.json')
      .then(r => r.json())
      .then(data => {
        allJobs = data;
        filteredJobs = data;
        renderStats();
        populateCategories();
        renderNextBatch();
      })
      .catch(e => {
        document.getElementById('jobsContainer').innerHTML = '<p>Failed to load jobs.json. Please make sure it exists.</p>';
      });

    function renderStats() {
      const companies = new Set(allJobs.map(j => j.company)).size;
      const locations = new Set(allJobs.map(j => j.location)).size;
      const categories = new Set(allJobs.map(j => j.category)).size;
      document.getElementById('stats').innerHTML = `
        <div class="stat-card"><div class="num">${allJobs.length}</div><div class="label">Active Jobs</div></div>
        <div class="stat-card"><div class="num">${companies}</div><div class="label">Companies</div></div>
        <div class="stat-card"><div class="num">${locations}</div><div class="label">Locations</div></div>
        <div class="stat-card"><div class="num">${categories}</div><div class="label">Categories</div></div>
      `;
    }

    function populateCategories() {
      const cats = [...new Set(allJobs.map(j => j.category))].sort();
      const select = document.getElementById('categoryFilter');
      cats.forEach(cat => {
        const opt = document.createElement('option');
        opt.value = cat;
        opt.textContent = cat;
        select.appendChild(opt);
      });
    }

    function renderNextBatch() {
      const container = document.getElementById('jobsContainer');
      const batch = filteredJobs.slice(displayedCount, displayedCount + BATCH_SIZE);
      batch.forEach(job => {
        const card = document.createElement('article');
        card.className = 'job-card';
        card.innerHTML = `
          <h3>${escapeHtml(job.title)}</h3>
          <div class="company">${escapeHtml(job.company)}</div>
          <div class="meta">📍 ${escapeHtml(job.location)} · ${escapeHtml(job.category)} · ${escapeHtml(job.type || 'Full-time')}</div>
          <a href="${escapeHtml(job.apply_url)}" target="_blank" rel="noopener" class="apply-btn">Apply ↗</a>
        `;
        container.appendChild(card);
      });
      displayedCount += batch.length;
      const loadMoreBtn = document.getElementById('loadMore');
      if (displayedCount >= filteredJobs.length) {
        loadMoreBtn.classList.add('hidden');
      } else {
        loadMoreBtn.classList.remove('hidden');
      }
    }

    function resetAndRender() {
      displayedCount = 0;
      document.getElementById('jobsContainer').innerHTML = '';
      renderNextBatch();
    }

    // Search and filter
    document.getElementById('searchInput').addEventListener('input', function(e) {
      const q = e.target.value.toLowerCase();
      const cat = document.getElementById('categoryFilter').value;
      filteredJobs = allJobs.filter(job => {
        const matchesQ = q === '' || job.title.toLowerCase().includes(q) || job.company.toLowerCase().includes(q) || job.location.toLowerCase().includes(q);
        const matchesCat = cat === '' || job.category === cat;
        return matchesQ && matchesCat;
      });
      resetAndRender();
    });

    document.getElementById('categoryFilter').addEventListener('change', function(e) {
      const q = document.getElementById('searchInput').value.toLowerCase();
      const cat = e.target.value;
      filteredJobs = allJobs.filter(job => {
        const matchesQ = q === '' || job.title.toLowerCase().includes(q) || job.company.toLowerCase().includes(q) || job.location.toLowerCase().includes(q);
        const matchesCat = cat === '' || job.category === cat;
        return matchesQ && matchesCat;
      });
      resetAndRender();
    });

    document.getElementById('loadMore').addEventListener('click', renderNextBatch);

    function escapeHtml(s) {
      const d = document.createElement('div');
      d.textContent = s;
      return d.innerHTML;
    }
  </script>
</body>
</html>
