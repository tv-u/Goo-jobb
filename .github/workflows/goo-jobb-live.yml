name: GOO-JOBB LIVE 40 SOURCES

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: goo-jobb-live
  cancel-in-progress: false

jobs:

  sync:
    name: Fetch real jobs
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Fetch all live sources
        run: node scripts/instant-live-sync.mjs

      - name: Validate dataset
        run: |
          node - <<'NODE'
          const fs = require("fs");

          const data =
            JSON.parse(
              fs.readFileSync(
                "public/jobs.json",
                "utf8"
              )
            );

          if (!Array.isArray(data.jobs)) {
            throw new Error("Invalid jobs array");
          }

          if (data.jobs.length === 0) {
            throw new Error("ZERO REAL JOBS");
          }

          const ids = new Set(
            data.jobs.map(x => x.id)
          );

          if (ids.size !== data.jobs.length) {
            throw new Error("Duplicate IDs found");
          }

          console.log(
            "REAL UNIQUE JOBS:",
            data.jobs.length
          );
          NODE

      - name: Commit live dataset
        run: |
          git config user.name "GOO-JOBB Live Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add public/jobs.json public/job-sync-status.json public/live-jobs.js scripts/instant-live-sync.mjs

          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: live jobs sync"
            git push origin main
          fi

  deploy:
    name: Deploy GitHub Pages
    needs: sync
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
