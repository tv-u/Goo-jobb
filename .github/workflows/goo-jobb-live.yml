name: GOO-JOBB Canonical Live Worldwide

on:
  push:
    branches:
      - main
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: goo-jobb-pages
  cancel-in-progress: true

jobs:

  sync:
    name: Worldwide real-job sync
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Existing worldwide engine
        run: node scripts/goo-jobb-master-sync.mjs
        env:
          GOO_JOBB_WORLDWIDE: "1"

      - name: Existing enterprise index
        run: node scripts/build-enterprise-index.mjs

      - name: Existing search index
        run: node scripts/build-v2-search.mjs

      - name: Existing SEO engine
        run: node scripts/build-seo-v2.mjs

      - name: Existing SEO job routes
        run: node scripts/goo-jobb-seo-pages.mjs

      - name: Existing sitemap
        run: node scripts/goo-jobb-sitemap.mjs

      - name: Add 10 additional public ATS sources
        run: node scripts/goo-jobb-extra-sources.mjs

      - name: Rebuild SEO routes after source merge
        run: node scripts/goo-jobb-seo-pages.mjs

      - name: Validate
        run: node scripts/goo-jobb-validate.mjs

      - name: Validate root
        run: |
          test -s index.html
          test -s public/jobs-worldwide.json
          test -s public/manifest.webmanifest
          test -s public/sitemap.xml || test -s sitemap.xml

      - name: Commit generated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public jobs-worldwide.json jobs.json jobs-search-index.json jobs-seo-index.json seo-url-index.json sitemap.xml robots.txt index.html scripts/goo-jobb-extra-sources.mjs public/ai/goo-jobb-local-intelligence.js
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "chore: worldwide jobs SEO AI refresh"
            git push origin main
          fi

  deploy:
    name: Deploy GitHub Pages
    needs: sync
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      - name: Checkout final main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Prepare Pages
        run: |
          rm -rf _site
          mkdir -p _site

          cp -f index.html _site/index.html
          cp -a public/. _site/

          if [ -f jobs-worldwide.json ]; then
            cp jobs-worldwide.json _site/jobs-worldwide.json
          fi

          if [ -f jobs.json ]; then
            cp jobs.json _site/jobs.json
          fi

          if [ -f jobs-search-index.json ]; then
            cp jobs-search-index.json _site/jobs-search-index.json
          fi

          if [ -f sitemap.xml ]; then
            cp sitemap.xml _site/sitemap.xml
          fi

          if [ -f robots.txt ]; then
            cp robots.txt _site/robots.txt
          fi

          touch _site/.nojekyll

          test -s _site/index.html
          test -s _site/jobs-worldwide.json
          test -s _site/manifest.webmanifest

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
